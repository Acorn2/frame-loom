<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameLoom 审片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191c;color:#f2f0ec;font:16px/1.5 system-ui,sans-serif}header,main{max-width:1360px;margin:auto;padding:18px clamp(16px,3vw,44px)}header{border-bottom:1px solid #41494d;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header strong{color:#9ddbc6}h1,h2,p{margin:0}h1{font-size:1.15rem}h2{font-size:1rem;margin-bottom:12px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:28px}video{width:100%;display:block;max-height:65vh;background:#08090a}button,textarea{font:inherit}button{cursor:pointer;min-height:40px;padding:6px 13px;border:1px solid #6d807d;border-radius:5px;background:#27312f;color:#eef4f2}button.primary{background:#ade7cc;color:#14261e;border-color:#ade7cc;font-weight:650}button:disabled{opacity:.5;cursor:default}textarea{width:100%;margin:6px 0;padding:10px;background:#202528;color:white;border:1px solid #70817d;border-radius:5px}#position,small{color:#b6c4c1;font-variant-numeric:tabular-nums}#position{margin:12px 0}section{min-width:0}article{padding:14px 0;border-top:1px solid #41494d}article p{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}article button{margin:2px 6px 2px 0}details{margin:.6em 0}summary{cursor:pointer}#qa{margin-top:24px}#qa article{padding:6px 0}#qa button{margin-left:6px}article video{margin:10px 0}form{margin-top:14px}#message{color:#b9e8cd;margin-top:8px}button:focus-visible{outline:3px solid white} @media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><strong>FrameLoom / 审片</strong><h1 id="title">载入候选视频…</h1></header>
<main><section aria-label="播放与标记"><video id="video" controls playsinline preload="metadata"></video>
<p id="position"></p><button id="mark" class="primary" disabled>暂停并记问题</button>
<form id="form" hidden><label id="label" for="note">问题说明</label><textarea id="note" required maxlength="2000" rows="3"></textarea><button class="primary" type="submit">保存反馈</button> <button id="cancel" type="button">取消</button></form><p id="message" role="status"></p><section id="qa"><h2>逐帧 QA</h2><div id="groups"></div></section></section>
<section><h2>审片反馈</h2><div id="list"></div></section></main><script type="module" src="/player.js"></script></body></html>
